name: Windows sandbox helper

on:
  push:
    branches: [main]
    paths:
      - "native/windows-sandbox/**"
      - ".github/workflows/windows-sandbox.yml"
  pull_request:
    paths:
      - "native/windows-sandbox/**"
      - ".github/workflows/windows-sandbox.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native helper
        working-directory: native/windows-sandbox
        run: cargo check
      - name: Build native helper
        working-directory: native/windows-sandbox
        run: cargo build --release
      - name: Probe capabilities
        shell: pwsh
        run: |
          .\native\windows-sandbox\target\release\locdex-windows-sandbox.exe capabilities
