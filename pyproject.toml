[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locdex"
version = "1.3.0"
description = "A local-first agentic coding CLI with hardware-aware GGUF inference, direct workspace editing, routing and Git tools."
readme = "README.md"
authors = [
    { name = "Emmanuel Amoo", email = "amooemma10@gmail.com" },
    { name = "Gideon Amoo", email = "amooademola55@gmail.com" },
]
maintainers = [
    { name = "Enoch Amoo", email = "amooadeyinka887@gmail.com" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.32",
    "huggingface-hub>=0.30",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
locdex = "locdex.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
