[build-system]
requires = [
  "setuptools>=68",
  "wheel>=0.43",
]
build-backend = "setuptools.build_meta"

[project]
name = "locdex"
version = "0.3.3a1"
description = "Local-first coding-agent runtime with repository intelligence, bounded context, native security, and optional cloud escalation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32",
  "huggingface-hub>=0.30",
  "platformdirs>=4.3",
  "PyYAML>=6.0",
  "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2.3,<3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "setuptools>=68",
  "wheel>=0.43",
]

[project.scripts]
locdex = "locdex.cli.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 120
