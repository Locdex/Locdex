[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locdex"
version = "1.3.1"
description = "A local-first AI coding agent with direct workspace editing, hardware-aware local inference, guarded Git tools, and optional cloud fallback."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Emmanuel Amoo", email = "amooemma10@gmail.com" },
    { name = "Gideon Amoo", email = "amooademola55@gmail.com" },
]

maintainers = [
    { name = "Enoch Amoo", email = "amooadeyinka887@gmail.com" },
]

keywords = [
    "ai",
    "coding-agent",
    "coding agent",
    "aider alternative",
    "cline alternative",
    "claude code alternative",
    "local-ai",
    "local llm",
    "developer-tools",
    "llm",
    "cli",
    "code-generation",
    "qwen",
    "gguf",
    "llama-cpp",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.32",
    "huggingface-hub>=0.30",
    "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
locdex = "locdex.main:cli"

[project.urls]
Homepage = "https://github.com/Locdex/Locdex"
Repository = "https://github.com/Locdex/Locdex"
Issues = "https://github.com/Locdex/Locdex/issues"
Changelog = "https://github.com/Locdex/Locdex/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-locdex"
