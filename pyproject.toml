[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locdex"
version = "0.3.2a1"
description = "Local-first coding-agent runtime with repository intelligence, bounded context, native security, and optional cloud escalation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32",
  "huggingface-hub>=0.30",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
locdex = "locdex.cli.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 120
