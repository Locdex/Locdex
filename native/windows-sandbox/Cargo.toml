[package]
name = "locdex-windows-sandbox"
version = "0.1.0"
edition = "2021"
description = "Native Windows process containment helper for Locdex"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
